# Tema claro: branco, azul e verde-agua (mesma paleta dos graficos do projeto).
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f8fd"
textColor = "#16324f"
linkColor = "#2a78d6"
borderColor = "#d5e3f3"
showWidgetBorder = true
baseRadius = "0.6rem"
# Atkinson Hyperlegible: fonte criada para maxima legibilidade (Braille Institute)
font = "Atkinson Hyperlegible Next:https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&display=swap, sans-serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
